name: Publish to MCP Registry

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out registry metadata
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install verified MCP publisher
        env:
          MCP_PUBLISHER_VERSION: "1.8.6"
          MCP_PUBLISHER_SHA256: "1fbe93fc0783c2394d8012c8d6e50a59e98cb2cc2d216264cc69f405d0e21340"
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --fail --location --show-error --silent --retry 3 \
            --user-agent agent-local --output mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          printf '%s  %s\n' "$MCP_PUBLISHER_SHA256" mcp-publisher.tar.gz | sha256sum --check --strict
          tar --extract --gzip --file mcp-publisher.tar.gz -- mcp-publisher

      - name: Validate registry manifest
        run: ./mcp-publisher validate server.json

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish Wine Labs MCP
        run: ./mcp-publisher publish server.json
